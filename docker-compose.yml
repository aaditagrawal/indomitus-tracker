version: "3.8"

services:
  indomitus-tracker:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "20250:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DB_FILE_NAME=/app/data/indomitus.db
    volumes:
      - ./data:/app/data
    restart: unless-stopped
